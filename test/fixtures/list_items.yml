# Fixtures insert rows straight into the database, bypassing model callbacks,
# so every synchronized record needs its public_id spelled out here.
milk:
  name: Leite
  normalized_name: leite
  category: dairy
  household: home
  status: pending
  position: 1
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>
  public_id: 40000000-0000-4000-8000-000000000001

detergent:
  name: Detergente
  normalized_name: detergente
  household: home
  status: purchased
  position: 2
  purchased_at: <%= 1.day.ago %>
  created_at: <%= 2.days.ago %>
  updated_at: <%= 1.day.ago %>
  public_id: 40000000-0000-4000-8000-000000000002
