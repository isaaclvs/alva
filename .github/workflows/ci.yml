name: CI

on:
  pull_request:
  # Every branch, so staging and feature branches are checked before main.
  push:
    branches: [ "**" ]

# A newer push to the same branch cancels the older run, except on main, where
# every commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan_ruby:
    # Ruby 3.3.4 has a prebuilt binary for 24.04, but not newer runner images.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version used in development, with coverage enforced.
          - ruby: .ruby-version
            coverage: "1"
          # Latest 3.3.x, like Debian's ruby package on the Atlas.
          - ruby: "3.3"
            coverage: "0"
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          COVERAGE: ${{ matrix.coverage }}
        run: bin/rails db:test:prepare test

      - name: Keep the coverage report
        uses: actions/upload-artifact@v7
        if: always() && matrix.coverage == '1'
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          if-no-files-found: ignore

  system-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  android:
    name: Android debug build, tests and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # No release keystore is configured in CI: the release APK is built
      # unsigned, only to catch problems that are exclusive to that variant.
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug verifyVariants

      - name: Keep the debug APK and reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests
          if-no-files-found: ignore

  android-instrumented:
    name: Android Room tests on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # The emulator needs hardware acceleration, which hosted Linux runners offer through KVM.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Real SQLite on a real Android: atomic queueing, reopening, ordering and migrations.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Keep the instrumented test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-instrumented
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

  android-rails-transport:
    name: Android command transport against real Rails
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # RAILS_ENV=test, a throwaway SQLite file and fixtures only; the script starts Rails on
      # loopback, runs the Kotlin transport against it (including an answer lost after commit)
      # and fails if that test was skipped.
      - name: Run the Kotlin transport against an isolated Rails
        env:
          GRADLE_CMD: ./gradlew --no-daemon
        run: script/android_rails_transport_check

  android-rails-sync:
    name: Android sync cycle on an emulator against real Rails
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Two devices with their own Room files and the emulator's HTTP stack, syncing through an isolated
      # RAILS_ENV=test server (throwaway SQLite, fixtures only) reached with `adb reverse`.
      # The online client (two OnlineRepository phones, no database) runs against its own isolated Rails right after,
      # on the same emulator.
      - name: Run the sync cycle and the online client against an isolated Rails
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRADLE_CMD: ./gradlew --no-daemon
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            script/android_rails_sync_check
            script/android_rails_online_check

  database:
    name: migrations, seeds and autoloading
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Migrate an empty database and compare with db/schema.rb
        run: |
          bin/rails db:create db:migrate
          git diff --exit-code db/schema.rb

      # alva-update seeds on every deploy, so seeding again must change nothing.
      - name: Seed twice
        run: |
          bin/rails db:seed
          bin/rails db:seed

      - name: Check that every file autoloads under its constant name
        run: bin/rails zeitwerk:check

  production:
    name: production boot (like the Atlas)
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: production
      BUNDLE_WITHOUT: development:test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Use a throwaway secret key base
        run: echo "SECRET_KEY_BASE=$(openssl rand -hex 64)" >> "$GITHUB_ENV"

      # The same steps as alva-update on the Atlas.
      - name: Prepare databases, seed and compile assets
        run: bin/rails db:prepare db:seed assets:precompile

      - name: Start Puma
        run: nohup bin/rails server -p 3000 > tmp/server.log 2>&1 &

      - name: Smoke test through a simulated tailscale serve
        run: script/smoke_test http://127.0.0.1:3000

      - name: Show the server log
        if: failure()
        run: cat tmp/server.log
