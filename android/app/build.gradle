import groovy.xml.MarkupBuilder

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def twaManifest = [
    applicationId: 'net.ts.taild80ca0.atlas.twa',
    hostName: 'atlas.taild80ca0.ts.net', // The domain being opened in the TWA.
    launchUrl: '/', // The start path for the TWA. Must be relative to the domain.
    name: 'Alva', // The application name.
    launcherName: 'Alva', // The name shown on the Android Launcher.
    themeColor: '#09090B', // The color used for the status bar.
    themeColorDark: '#09090B', // The color used for the dark status bar.
    navigationColor: '#09090B', // The color used for the navigation bar.
    navigationColorDark: '#09090B', // The color used for the dark navbar.
    navigationDividerColor: '#09090B', // The navbar divider color.
    navigationDividerColorDark: '#09090B', // The dark navbar divider color.
    backgroundColor: '#09090B', // The color used for the splash screen background.
    enableNotifications: false, // Set to true to enable notification delegation.
    // Every shortcut must include the following fields:
    // - name: String that will show up in the shortcut.
    // - short_name: Shorter string used if |name| is too long.
    // - url: Absolute path of the URL to launch the app with (e.g '/create').
    // - icon: Name of the resource in the drawable folder to use as an icon.
    shortcuts: [],
    // The duration of fade out animation in milliseconds to be played when removing splash screen.
    splashScreenFadeOutDuration: 300,
    generatorApp: 'PWABuilder', // Application that generated the Android Project
    // The fallback strategy for when Trusted Web Activity is not available. Possible values are
    // 'customtabs' and 'webview'.
    fallbackType: 'customtabs',
    enableSiteSettingsShortcut: 'true',
    orientation: 'portrait',
]

android {
    compileSdkVersion 36
    namespace 'net.ts.taild80ca0.atlas.twa'
    defaultConfig {
        applicationId 'net.ts.taild80ca0.atlas.twa'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 7
        versionName '2.0.2'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // The name for the application
        resValue "string", "appName", twaManifest.name

        // The name for the application on the Android Launcher
        resValue "string", "launcherName", twaManifest.launcherName

        // The URL that will be used when launching the TWA from the Android Launcher
        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl




            // The URL the Web Manifest for the Progressive Web App that the TWA points to. This
            // is used by Chrome OS and Meta Quest to open the Web version of the PWA instead of
            // the TWA, as it will probably give a better user experience for non-mobile devices.
            resValue "string", "webManifestUrl", 'https://atlas.taild80ca0.ts.net/manifest.json'



            // This is used by Meta Quest.
            resValue "string", "fullScopeUrl", 'https://atlas.taild80ca0.ts.net/'




        // The hostname is used when building the intent-filter, so the TWA is able to
        // handle Intents to open host url of the application.
        resValue "string", "hostName", twaManifest.hostName

        // This attribute sets the status bar color for the TWA. It can be either set here or in
        // `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the status bar color defaults to #FFFFFF - white.
        resValue "color", "colorPrimary", twaManifest.themeColor

        // This attribute sets the dark status bar color for the TWA. It can be either set here or in
        // `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the status bar color defaults to #000000 - white.
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark

        // This attribute sets the navigation bar color for the TWA. It can be either set here or
        // in `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the navigation bar color defaults to #FFFFFF - white.
        resValue "color", "navigationColor", twaManifest.navigationColor

        // This attribute sets the dark navigation bar color for the TWA. It can be either set here
        // or in `res/values/colors.xml`. Setting in both places is an error and the app will not
        // compile. If not set, the navigation bar color defaults to #000000 - black.
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark

        // This attribute sets the navbar divider color for the TWA. It can be either
        // set here or in `res/values/colors.xml`. Setting in both places is an error and the app
        // will not compile. If not set, the divider color defaults to #00000000 - transparent.
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor

        // This attribute sets the dark navbar divider color for the TWA. It can be either
        // set here or in `res/values/colors.xml`. Setting in both places is an error and the
        //app will not compile. If not set, the divider color defaults to #000000 - black.
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark

        // Sets the color for the background used for the splash screen when launching the
        // Trusted Web Activity.
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        // Defines a provider authority for the Splash Screen
        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'

        // The enableNotification resource is used to enable or disable the
        // TrustedWebActivityService, by changing the android:enabled and android:exported
        // attributes
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()

        twaManifest.shortcuts.eachWithIndex { shortcut, index ->
            resValue "string", "shortcut_name_$index", "$shortcut.name"
            resValue "string", "shortcut_short_name_$index", "$shortcut.short_name"
        }

        // The splashScreenFadeOutDuration resource is used to set the duration of fade out animation in milliseconds
        // to be played when removing splash screen. The default is 0 (no animation).
        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()

        resValue "string", "generatorApp", twaManifest.generatorApp

        resValue "string", "fallbackType", twaManifest.fallbackType

        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation


    }

    signingConfigs {
        release {
            def keystore = System.getenv('ALVA_ANDROID_KEYSTORE')
            if (keystore) storeFile file(keystore)
            storePassword System.getenv('ALVA_ANDROID_STORE_PASSWORD')
            keyAlias System.getenv('ALVA_ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ALVA_ANDROID_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            // The development build installs alongside the production APK.
            applicationIdSuffix '.debug'
            versionNameSuffix '-dev'
            resValue "string", "appName", "Alva Dev"
            resValue "string", "launcherName", "Alva Dev"
            // Own FileProvider authority, otherwise both installs would collide.
            resValue "string", "providerAuthority", twaManifest.applicationId + '.debug.fileprovider'
            // The server the native debug client connects to. Defaults to the real host
            // (https). `-PalvaServerUrl=http://127.0.0.1:3000` points it at a local Rails
            // reached through `adb reverse`; only https or loopback is ever accepted.
            def serverUrl = project.findProperty('alvaServerUrl') ?: ('https://' + twaManifest.hostName)
            buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
        }
        release {
            buildConfigField 'String', 'SERVER_URL', '"https://atlas.taild80ca0.ts.net"'
            // Only attach the signing config when the local keystore is available,
            // so CI can assembleRelease without any private key.
            if (System.getenv('ALVA_ANDROID_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
        }
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
    }
    sourceSets {
        debug.java.srcDirs += 'src/online/java'
        release.java.srcDirs += 'src/online/java'
        debug.res.srcDirs += 'src/online/res'
        release.res.srcDirs += 'src/online/res'
        // Room schema history (one JSON per database version). The instrumented
        // migration tests read it as assets, so a version bump without its
        // schema file and migration fails.
        androidTest.assets.srcDirs += files("$projectDir/schemas")
        // Scenarios shared by the JVM tests (in-memory storage) and the instrumented
        // ones (real Keystore and Room): the same behavior must hold on both.
        testDebug.java.srcDirs += 'src/sharedTest/java'
        androidTest.java.srcDirs += 'src/sharedTest/java'

        // The matching corpus shared with the Rails suite (TextNormalizer,
        // ItemCategorizer, ItemNameSplitter, add rules): the JVM and instrumented
        // tests read the very same file, test/fixtures/files/matching_corpus.json.
        test.resources.srcDirs += files("$rootDir/../test/fixtures/files")
        androidTest.assets.srcDirs += files("$rootDir/../test/fixtures/files")
    }
}

// Room's compiler exports the schema of every database version here (kept in Git).
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

// Keep Java and Kotlin bytecode targets aligned with compileOptions above.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

task generateShorcutsFile {
    assert twaManifest.shortcuts.size() < 5, "You can have at most 4 shortcuts."
    twaManifest.shortcuts.eachWithIndex { s, i ->
        assert s.name != null, 'Missing `name` in shortcut #' + i
        assert s.short_name != null, 'Missing `short_name` in shortcut #' + i
        assert s.url != null, 'Missing `icon` in shortcut #' + i
        assert s.icon != null, 'Missing `url` in shortcut #' + i
    }

    def shortcutsFile = new File("$projectDir/src/main/res/xml", "shortcuts.xml")

    def xmlWriter = new StringWriter()
    def xmlMarkup = new MarkupBuilder(new IndentPrinter(xmlWriter, "    ", true))

    xmlMarkup
        .'shortcuts'('xmlns:android': 'http://schemas.android.com/apk/res/android') {
            twaManifest.shortcuts.eachWithIndex { s, i ->
                'shortcut'(
                        'android:shortcutId': 'shortcut' + i,
                        'android:enabled': 'true',
                        'android:icon': '@drawable/' + s.icon,
                        'android:shortcutShortLabel': '@string/shortcut_short_name_' + i,
                        'android:shortcutLongLabel': '@string/shortcut_name_' + i) {
                    'intent'(
                            'android:action': 'android.intent.action.MAIN',
                            'android:targetPackage': twaManifest.applicationId,
                            'android:targetClass': twaManifest.applicationId + '.LauncherActivity',
                            'android:data': s.url)
                    'categories'('android:name': 'android.intent.category.LAUNCHER')
                }
            }
        }
    shortcutsFile.text = xmlWriter.toString() + '\n'
}

preBuild.dependsOn(generateShorcutsFile)

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // Native online UI shared by debug and the signed production app.
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    // The paused offline implementation remains debug-only. Production has no Room. See
    // docs/plans/android-local-persistence.md.
    debugImplementation 'androidx.room:room-runtime:2.7.2'
    debugImplementation 'androidx.room:room-ktx:2.7.2'
    kspDebug 'androidx.room:room-compiler:2.7.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Persistent synchronization belongs only to the native development client.
    debugImplementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'androidx.work:work-testing:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM tests (the android.jar one is a stub).
    testImplementation 'org.json:json:20250517'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.05.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // The empty ComponentActivity that createComposeRule() hosts a single composable in (debug only).
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // A real HTTP server on loopback for the pairing/identification tests (test-only).
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// Verifies the effective merged manifest of each variant: exactly one launcher
// entry, the native Compose screen only in debug, the TWA launcher kept in
// release. Both variants now launch the native client. Wired into `check` and CI.
abstract class VerifyLauncherEntry extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getMergedManifest()

    @Input
    abstract Property<Boolean> getExpectNativeEntry()

    @TaskAction
    void verify() {
        def text = mergedManifest.get().asFile.getText('UTF-8')
        def twaName = 'net.ts.taild80ca0.atlas.twa.LauncherActivity'
        def nativeName = 'net.ts.taild80ca0.atlas.twa.MainActivity'

        // Captures a whole <activity> element by its android:name. Every activity
        // we inspect has children (intent-filters), so the closing tag is found.
        def activityBlock = { String name ->
            def pattern = '(?s)<activity\\b[^>]*android:name="' +
                java.util.regex.Pattern.quote(name) + '".*?</activity>'
            def matcher = (text =~ pattern)
            matcher.find() ? matcher.group() : null
        }

        def launcherCount = (text =~ /android\.intent\.category\.LAUNCHER/).count
        if (launcherCount != 1) {
            throw new GradleException("Expected exactly one launcher entry, found ${launcherCount}")
        }

        def nativeBlock = activityBlock(nativeName)
        def twaBlock = activityBlock(twaName)

        if (expectNativeEntry.get()) {
            if (nativeBlock == null || !nativeBlock.contains('android.intent.category.LAUNCHER')) {
                throw new GradleException("Native launcher must be ${nativeName}")
            }
            if (twaBlock == null || !twaBlock.contains('android:enabled="false"')) {
                throw new GradleException('Native manifest must disable the TWA LauncherActivity')
            }
        } else {
            if (twaBlock == null || !twaBlock.contains('android.intent.category.LAUNCHER')) {
                throw new GradleException("Release launcher must be ${twaName}")
            }
            if (nativeBlock != null) {
                throw new GradleException('Release manifest must not ship the native MainActivity')
            }
        }
    }
}

// Both native variants apply the credential backup exclusions and network policy.
// Debug permits loopback for test harnesses; release is TLS-only.
abstract class VerifyAccessPolicy extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getMergedManifest()

    @Input
    abstract Property<Boolean> getExpectPolicy()

    @TaskAction
    void verify() {
        def text = mergedManifest.get().asFile.getText('UTF-8')
        def required = [
            'android:dataExtractionRules="@xml/alva_data_extraction_rules"',
            'android:fullBackupContent="@xml/alva_backup_rules"',
            'android:networkSecurityConfig="@xml/alva_network_security_config"',
        ]
        required.each { attribute ->
            def present = text.contains(attribute)
            if (expectPolicy.get() && !present) {
                throw new GradleException("Native manifest must declare ${attribute}")
            }
            if (!expectPolicy.get() && present) {
                throw new GradleException("Release manifest must not declare ${attribute}")
            }
        }
        if (!text.contains('android:allowBackup="true"')) {
            throw new GradleException('allowBackup must stay as it was (the rules decide what is excluded)')
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def capitalized = variant.name.capitalize()
        tasks.register("verify${capitalized}Manifest", VerifyLauncherEntry) {
            mergedManifest.set(variant.artifacts.get(
                com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE))
            expectNativeEntry.set(true)
        }
        tasks.register("verify${capitalized}AccessPolicy", VerifyAccessPolicy) {
            mergedManifest.set(variant.artifacts.get(
                com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE))
            expectPolicy.set(true)
        }
    }
}

// The paused offline implementation stays in debug; production is strictly online.
tasks.register('verifyReleaseHasNoLocalPersistence') {
    def releaseGroups = provider {
        configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.moduleVersion?.group }.findAll { it != null }.toSet()
    }
    def debugGroups = provider {
        configurations.debugRuntimeClasspath.incoming.resolutionResult.allComponents
            .collect { it.moduleVersion?.group }.findAll { it != null }.toSet()
    }
    doLast {
        def banned = ['androidx.room', 'androidx.work']
        banned.each { group ->
            if (releaseGroups.get().any { it.startsWith(group) }) {
                throw new GradleException("Release runtime classpath must not contain ${group}")
            }
        }
        if (!debugGroups.get().contains('androidx.room')) {
            throw new GradleException('Debug runtime classpath is expected to contain Room')
        }
    }
}

tasks.register('verifyVariants') {
    dependsOn 'verifyDebugManifest', 'verifyReleaseManifest', 'verifyReleaseHasNoLocalPersistence',
        'verifyDebugAccessPolicy', 'verifyReleaseAccessPolicy'
}

tasks.named('check') {
    dependsOn 'verifyVariants'
}
